##
## Nginx site config for MarketLens
## Serves the React SPA from frontend/dist/ and reverse-proxies the Flask API.
##
## Deploy path: /etc/nginx/sites-available/marketlens
## Enable with: ln -s /etc/nginx/sites-available/marketlens /etc/nginx/sites-enabled/marketlens
##

server {
    listen 80;
    server_name _;

    # React SPA static files
    root /home/ubuntu/stock-market-predictor/frontend/dist;
    index index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serve static assets with long-term caching (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy: backend API (Flask)
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Disable buffering for the SSE streaming endpoint specifically
    location /api/predict_stream/ {
        proxy_pass             http://127.0.0.1:5001;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     120s;
        add_header             X-Accel-Buffering no;
        chunked_transfer_encoding on;
    }


    # SPA fallback — any unmatched path serves index.html (React Router support)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
