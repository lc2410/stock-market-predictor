name: Full CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check for Python Vulnerabilities
        run: |
          pip install safety
          safety check -r backend/requirements.txt
          
      - name: Check for NPM Vulnerabilities
        run: |
          cd frontend
          npm install --package-lock-only
          npm audit --audit-level=high

  lint:
    name: Code Linting
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Flake8
        run: pip install flake8
      - name: Run Python Linter
        run: flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install NPM Dependencies
        run: cd frontend && npm ci
      - name: Run JS/JSX Linter
        run: cd frontend && npm run lint

  test-backend:
    name: Backend Tests & Coverage
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -r backend/requirements.txt
        
      - name: Download NLP Model
        run: PYTHONPATH=. python backend/ml_models/scripts/download_pretrained_model.py

      - name: Run Pytest Suite
        run: PYTHONPATH=. python -m pytest backend/tests/ --cov=. --cov-report=xml
        
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test-frontend:
    name: Frontend Tests
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install NPM Dependencies & Browsers
        run: |
          cd frontend
          npm ci
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          npx playwright install --with-deps

      - name: Run Playwright Tests
        run: cd frontend && npm run test:frontend
        
      - name: Upload Playwright Report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  sonarcloud:
    name: Static Code Analysis
    needs: [test-backend, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

  deploy:
    name: Deploy to Production
    needs: [lint, test-backend, test-frontend, sonarcloud, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_WALLET_BASE64: ${{ secrets.DB_WALLET_BASE64 }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_WALLET_BASE64
          script: |
            set -e
            cd /home/ubuntu/stock-market-predictor
            sudo chown -R $(whoami):$(whoami) /home/ubuntu/stock-market-predictor
            git config --global --add safe.directory /home/ubuntu/stock-market-predictor
            git fetch origin main
            echo "$DB_WALLET_BASE64" | base64 -d > /home/ubuntu/wallet.zip
            mkdir -p /home/ubuntu/wallet
            python3 -m zipfile -e /home/ubuntu/wallet.zip /home/ubuntu/wallet
            sed -i "s|?/network/admin|/home/ubuntu/wallet|g" /home/ubuntu/wallet/sqlnet.ora




            git reset --hard origin/main

            # Install/update Python dependencies
            source venv/bin/activate
            pip install -r backend/requirements.txt
            python backend/ml_models/scripts/download_pretrained_model.py

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install Nginx if not present
            if ! command -v nginx &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y nginx

            fi

            # Build the React frontend
            cd frontend
            npm ci --prefer-offline
            npm run build
            cd ..

            # Ensure Nginx (www-data) has execute permissions to traverse the home directory
            # and read permissions to serve the static React assets.
            sudo chmod 711 /home/ubuntu
            sudo chmod 755 /home/ubuntu/stock-market-predictor
            sudo chmod 755 /home/ubuntu/stock-market-predictor/frontend
            sudo chmod -R 755 /home/ubuntu/stock-market-predictor/frontend/dist

            # Deploy Nginx config (idempotent)
            sudo systemctl stop forecaster || true
            sudo systemctl disable forecaster || true
            sudo rm -f /etc/systemd/system/forecaster.service || true
            sudo rm -f /etc/nginx/sites-enabled/forecaster || true
            sudo rm -f /etc/nginx/sites-available/forecaster || true
            sudo rm -f /etc/nginx/sites-enabled/default || true


            sudo cp infra/marketlens.nginx.conf /etc/nginx/sites-available/marketlens
            sudo ln -sf /etc/nginx/sites-available/marketlens /etc/nginx/sites-enabled/marketlens
            sudo nginx -t && sudo systemctl reload nginx

            # Recreate Systemd Service for Gunicorn to point to the new backend folder and port
            cat << 'SERVICE' | sudo tee /etc/systemd/system/marketlens.service
            [Unit]
            Description=Gunicorn instance to serve Stock MarketLens API
            After=network.target

            [Service]
            User=ubuntu
            Group=www-data
            WorkingDirectory=/home/ubuntu/stock-market-predictor/backend
            Environment="PATH=/home/ubuntu/stock-market-predictor/venv/bin"
            Environment="TNS_ADMIN=/home/ubuntu/wallet"
            ExecStart=/home/ubuntu/stock-market-predictor/venv/bin/gunicorn -w 4 --worker-class gthread --threads 10 -b 127.0.0.1:5001 --timeout 120 app:app

            [Install]
            WantedBy=multi-user.target
            SERVICE

            # Restart Flask/Gunicorn API server
            sudo systemctl daemon-reload
            sudo systemctl restart marketlens
            sleep 10

            # Health check — Nginx should serve the React app at /
            curl --fail http://localhost/ || (git reset --hard HEAD~1 && sudo systemctl restart marketlens && exit 1)